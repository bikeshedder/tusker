name: Release

on:
  push:
    tags:
      - "tusker-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RUST_VERSION: "1.96"
  TARGET: x86_64-unknown-linux-musl
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install release tooling
        run: sudo apt-get update && sudo apt-get install --yes musl-tools buildah

      - name: Set up Rust
        run: rustup update ${{ env.RUST_VERSION }} && rustup default ${{ env.RUST_VERSION }}

      - name: Add Rust target
        run: rustup target add ${{ env.TARGET }}

      - name: Build release binary
        run: cargo build --locked --release -p tusker --target ${{ env.TARGET }}

      - name: Package release artifacts
        run: |
          mkdir -p dist
          VERSION="${RELEASE_TAG#tusker-v}"
          ASSET_BASENAME="tusker-${VERSION}-${TARGET}"
          install -Dm755 "target/${TARGET}/release/tusker" "dist/${ASSET_BASENAME}/tusker"
          tar -C dist -czf "dist/${ASSET_BASENAME}.tar.gz" "${ASSET_BASENAME}"
          sha256sum "dist/${ASSET_BASENAME}.tar.gz" > "dist/${ASSET_BASENAME}.tar.gz.sha256"

      - name: Extract release notes from changelog
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#tusker-v}"
          CHANGELOG="crates/tusker/CHANGELOG.md"
          HEADING="## [${VERSION}]"

          # Section of this version, up to the next version heading, without
          # the link definitions at the end of the changelog.
          NOTES="$(awk -v heading="$HEADING" '
            index($0, "## [") == 1 { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' "$CHANGELOG" | sed -e '/./,$!d')"
          # Version of the next heading, i.e. the previous release.
          PREVIOUS="$(awk -v heading="$HEADING" '
            index($0, "## [") == 1 {
              if (found) { sub(/^## \[/, ""); sub(/\].*/, ""); print; exit }
              if (index($0, heading) == 1) found = 1
            }
          ' "$CHANGELOG")"

          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error file=${CHANGELOG}::No changelog entry found for ${VERSION}"
            exit 1
          fi

          {
            printf '%s\n' "$NOTES"
            if [ -n "$PREVIOUS" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/tusker-v%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS" "$RELEASE_TAG"
            fi
          } > dist/RELEASE_NOTES.md

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: dist/RELEASE_NOTES.md

      - name: Log in to GitHub Container Registry
        run: buildah login --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" ${{ env.REGISTRY }}

      - name: Assemble and push OCI image
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#tusker-v}"
          LOCAL_IMAGE="tusker-oci:${VERSION}"
          REGISTRY_IMAGE="${REGISTRY}/${IMAGE_NAME}"

          mkdir -p dist/image-root
          install -Dm755 "target/${TARGET}/release/tusker" "dist/image-root/tusker"

          ctr="$(buildah from scratch)"
          trap 'buildah rm "$ctr"' EXIT

          buildah add "$ctr" dist/image-root/tusker /tusker
          buildah config \
            --entrypoint '["/tusker"]' \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            "$ctr"

          buildah commit --format oci "$ctr" "$LOCAL_IMAGE"
          buildah push "$LOCAL_IMAGE" "docker://${REGISTRY_IMAGE}:${VERSION}"
