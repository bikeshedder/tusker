[package]
name = "tusker-query-derive"
version = "0.3.0"
edition = "2021"
description = "Derive macros for tusker-query query and row bindings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bikeshedder/tusker"
keywords = ["postgresql", "query", "derive", "proc-macro", "sql"]
categories = ["development-tools", "database"]

[lib]
proc-macro = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
darling = "0.24"
heck = "0.5"
proc-macro2 = "1.0.92"
quote = "1.0.37"
serde_json = "1.0.144"
sha2 = "0.11"
syn = { version = "3", features = ["visit-mut"] }
tusker-query-models = { version = "0.3.0", path = "../tusker-query-models" }
