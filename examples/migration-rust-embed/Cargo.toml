[package]
name = "tusker-example-migration-rust-embed"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bikeshedder/tusker"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.0.1", features = ["derive"] }
rust-embed = "8"
tokio = { version = "1.34.0", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "0.7.12", features = ["with-time-0_3"] }
tusker-migration = { version = "0.2.1", path = "../../crates/tusker-migration", features = ["rust-embed"] }
